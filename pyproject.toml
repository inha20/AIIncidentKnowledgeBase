[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsolution"
version = "0.1.0"
description = "Record, classify and share enterprise-AI errors, root causes and fixed prompts with your team."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
promptsolution = "promptsolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
